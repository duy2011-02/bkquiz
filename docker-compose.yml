name: bkquiz

services:
  postgres:
    image: postgres:16-alpine
    container_name: bkquiz-postgres
    restart: unless-stopped
    environment:
      # Dev credentials only - use environment variables in production
      POSTGRES_DB: bkquiz
      POSTGRES_USER: bkquiz
      POSTGRES_PASSWORD: bkquiz
    ports:
      - "5433:5432"
    volumes:
      - bkquiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkquiz -d bkquiz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Lưu ảnh câu hỏi khi chạy local (tương thích S3; production dùng Supabase Storage).
  # MinIO đã ngừng phát hành image công khai `minio/minio`, `minio/mc` trên Docker Hub (2025) nên dùng bản Bitnami.
  # MINIO_DEFAULT_BUCKETS tự tạo bucket và cho đọc công khai (`:download`) — thay cho container minio-init trước đây.
  minio:
    image: bitnamilegacy/minio:2025.1.20
    container_name: bkquiz-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: bkquiz-media:download
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bkquiz_minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bkquiz_postgres_data:
  bkquiz_minio_data:


